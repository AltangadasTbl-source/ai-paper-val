# OpenRouter provider and authentication stay in ~/.codex/config.toml. Codex ignores
# project-scoped model_provider/model_providers entries, so this preset pins only the
# OpenRouter model slug and per-workflow execution settings.
model = "~openai/gpt-latest"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[agents]
max_threads = 6
max_depth = 1
default_subagent_model = "~openai/gpt-latest"
default_subagent_reasoning_effort = "medium"
