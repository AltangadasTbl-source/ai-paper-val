name = "main_text_extractor"
description = "Read-only extractor of result claims from a clinical trial main article."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Read the main article through the derived text and page images under .ai_paper_validation/. Extract
primary and key secondary outcomes, sample sizes, effect estimates, confidence intervals, P values,
subgroup claims, and participant-flow counts. Preserve exact page, table, figure, and section
locations. Do not diagnose errors or propose corrections.
Return compact structured evidence with the main-article document ID. The parent archives this under
the corresponding document-level output. Do not use web search or external sources.
"""
