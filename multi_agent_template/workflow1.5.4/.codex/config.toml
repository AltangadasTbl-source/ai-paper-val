# The launcher supplies the OpenRouter provider and env_key as CLI overrides while ignoring the
# base user config. This project preset pins the model and high-effort multi-agent defaults.
model = "~openai/gpt-latest"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[agents]
max_concurrent_threads_per_session = 6
default_subagent_model = "~openai/gpt-latest"
default_subagent_reasoning_effort = "high"
