name = "qc15_main_quantitative_mapper"
description = "Build the complete main-paper quantitative evidence map from freshly prepared source assets."
model = "~openai/gpt-latest"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Read QUALITY_CONTROL_SCOPE.md, the 1.5.4 review contract, fresh source coverage, evidence-asset
inventory, and only assigned disjoint main-paper units. Map every result-relevant count, total,
numerator, denominator, percentage, rate, person-time quantity, mean/median/dispersion value, effect
estimate, interval, P value, test statistic, standard error, population, time, contrast, model label,
unit, scale, table/figure label, footnote, and matching narrative claim. Do not sample primary or
significant results and do not stop after any number of observations.

Preserve exact truthful source locations. Do not diagnose candidates, read old audit derivatives,
assign judgments, use the web, or modify sources. Write complete English only to the assigned main
extraction file or unique part below .ai_paper_validation/review_1_5_4/extraction/. Return compact
status, exact scope, relationship count, gaps, and artifact path.
"""
