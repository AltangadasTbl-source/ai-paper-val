[runtime]
platform = "linux"
autonomous = true
agent_first = true
ask_before_execution = false

[parallel]
enabled = true
max_specialists = 6
specialist_return_max_lines = 12

[context]
max_normalized_text_chars_per_shard = 160000
max_rendered_pages_per_shard = 24
max_relationships_per_shard = 80
max_candidates_per_recheck_shard = 40

[review]
candidate_limit = "none"
report_all_candidates = true
ai_adjudication = false
tone = "quality-control"
primary_focus = "numeric-statistical-reporting-consistency"

[evidence]
reuse_existing_extractions = false
restart_preprocessing = true
restart_candidate_discovery = true
legacy_audit_outputs_are_evidence_inputs = false

[ocr]
mode = "cpu"
allow_gpu = false
native_text_first = true
new_ocr_scope = "pages-with-unusable-native-text"
preferred_backend = "tesseract-cpu"
missing_backend = "record-and-continue"

[python]
role = "auxiliary-only"
allowed_scripts = ["extract_office_source.py", "render_report.py", "validate_review.py"]

[tools]
pandoc = "pandoc"
pdfinfo = "pdfinfo"
pdftotext = "pdftotext"
pdftoppm = "pdftoppm"
pdftocairo = "pdftocairo"
tesseract = "tesseract"
libreoffice = "libreoffice"
sha256sum = "sha256sum"
