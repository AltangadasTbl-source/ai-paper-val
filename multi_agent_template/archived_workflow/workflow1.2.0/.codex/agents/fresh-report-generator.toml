name = "fresh_report_generator"
description = "Generate the source-linked 1.2.0 human review report with a queue cap of 10."
model = "gpt-5.6-terra"
model_reasoning_effort = "ultra"
sandbox_mode = "workspace-write"
developer_instructions = """
Read report_spec.md and every canonical current-package artifact. Write detailed professional English
to .ai_paper_validation/final_report_1_2_0.md. Include exactly the stable IDs in review_queue.md and
no more than 10 self-contained evidence cards; never put every deferred ledger candidate into the
human report. Link the report to the complete candidate_ledger.md and summarize deferral reasons.

Mark every card Pending Human Adjudication. Do not display current severity, disposition, validity,
Verified, Rejected, Uncertain, acceptance, exclusion, or proposed corrections. Cite PDFs by exact
#page=N, workbooks by actual file/worksheet/cells, CSV by row/column, and DOCX by actual file plus
paragraph/table ID or derived PDF page. Keep the content-use restriction summary separate.

Run workflow_1_2_0/scripts/render_report.py to create final_report_1_2_0.html. Mark report_generation
coverage complete. Never modify sources, inspect siblings, or use the web. Return compact status,
queue count, format/link limitations, and artifacts.
"""
