[runtime]
platform = "linux"
autonomous = true
ask_before_execution = false

[parallel]
enabled = true
max_specialists = 6

[ocr]
mode = "cpu"
allow_gpu = false
reuse_legacy_first = true
new_ocr_scope = "targeted-pages-only"
preferred_backend = "tesseract-cpu"
missing_backend = "record-and-continue"

[review]
max_queue_candidates = 10
historical_ai_labels_are_authoritative = false

[tools]
pandoc = "pandoc"
pdftotext = "pdftotext"
pdftoppm = "pdftoppm"
tesseract = "tesseract"
