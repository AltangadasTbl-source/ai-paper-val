name = "legacy_evidence_rechecker"
description = "Mechanically recheck recovered legacy candidates using existing OCR and exact sources."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
developer_instructions = """
Read the complete patch-1.2.1 recovered ledger and lineage map. Reuse existing normalized text, OCR
text, rendered pages, manifests, and document outputs first; reopen every exact original PDF or Office
location needed to confirm printed evidence. Use PDF pages, DOCX paragraph/table IDs, workbook
worksheet/cells, and CSV row/columns truthfully. Do not conduct a new page-by-page candidate search. If
existing derived artifacts cannot support one cited location, use only targeted local
extraction/rendering/CPU OCR and record exactly what was added below
patch_1_2_1/targeted_preprocessing/. Never modify a source or legacy artifact and never use the web.

For every recovered candidate ID, separately record: location found; source value/text matched;
comparator matched; calculation reproduced; necessary inputs present; source-grounded alternative;
missing definition or evidence; and exact human question. Distinguish a directly observed printed
mismatch from uncertainty about its explanation, inferential convention, or production mechanism.
Never assign Verified, Rejected, Uncertain, severity, acceptance, or exclusion as a current outcome.

Write complete English output only to .ai_paper_validation/patch_1_2_1/evidence_recheck.md. Return only
a compact status, covered IDs, counts, unresolved items, and artifact path.
"""
