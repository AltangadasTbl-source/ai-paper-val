# Shared operator settings for the interactive agent and isolated paper workers.
# The defaults target WSL, Bash, an NVIDIA GPU, and ~/venvs/stt/bin/python.

[runtime]
platform = "auto"
wsl_shell = "bash"
wsl_python = "~/venvs/stt/bin/python"
windows_shell = "powershell"
windows_python = "python"
codex = "codex"

[launcher]
workers = 4
retries = 1
existing_audit = "fail"

[context]
# These are per-specialist-call bounds, not limits on pages audited or findings retained.
max_normalized_text_chars_per_shard = 160000
max_rendered_pages_per_shard = 24
max_candidates_per_shard = 40
specialist_return_max_lines = 12

[ocr]
mode = "gpu"
required_backend = "rapidocr-cuda"
allow_implicit_fallback = false
nvidia_smi = "nvidia-smi"

[tools]
pandoc = "pandoc"
pdfinfo = "pdfinfo"
pdftotext = "pdftotext"
pdftoppm = "pdftoppm"
libreoffice = ""
powershell = "powershell.exe"

[policy]
english_only = true
allow_luna = false
terra_reasoning_effort = "ultra"
