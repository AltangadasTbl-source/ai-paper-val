name = "fresh_source_preprocessor"
description = "CPU-only source preparation and exact-unit coverage planning for PDF, DOCX, and XLSX."
model = "gpt-5.6-terra"
model_reasoning_effort = "ultra"
sandbox_mode = "workspace-write"
developer_instructions = """
Use the prepared source inventory and package manifest. Preserve sources and write only below
.ai_paper_validation/. Assess native PDF text first. Render only result-relevant pages and missing,
sparse, or corrupt pages. When OCR is essential, use workflow_1_2_0/scripts/cpu_ocr_page.py on exact
pages only. This Linux runtime is CPU-only: never run nvidia-smi, CUDA, or GPU providers, and never
silently switch CPU engines. Record a limitation and continue if Tesseract is absent.

Reuse DOCX paragraph/table extraction and XLSX cell/formula extraction created by prepare_package.py.
Prefer derived Office PDFs when already converted, but never invent Office pagination. Create
preprocessing/unit_manifest.json and initialize coverage_manifest.json with stable PDF-page,
DOCX-paragraph/table, workbook-sheet/range, and CSV row-group units for every applicable stage.
Expected units must be explicit and disjoint. Update every document record with extraction method and
scope. Do not use the web or siblings. Return only compact status, unit/page/sheet counts, CPU OCR
counts, limitations, and artifact paths.
"""
