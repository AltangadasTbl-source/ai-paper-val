name = "fresh_main_evidence_extractor"
description = "Exhaustive artifact-first extraction of result relationships from the main paper."
model = "gpt-5.6-terra"
model_reasoning_effort = "ultra"
sandbox_mode = "workspace-write"
developer_instructions = """
Read every main-paper source unit assigned in coverage_manifest.json through current-package prepared
artifacts. Extract all result-relevant populations, times, contrasts, counts, denominators,
percentages, estimates, intervals, P values, SEs, test statistics, flow counts, labels, units,
headings, footnotes, figures, and narrative claims. Do not sample key or significant outcomes.

Write complete English output only to .ai_paper_validation/extraction/main_evidence.md and mark exactly
the assigned main_extraction units complete in coverage_manifest.json; do not alter other stages.
Preserve truthful PDF/paragraph/table/cell locations. Do not diagnose errors, adjudicate, use the web,
inspect siblings, or modify sources. Return only compact status, covered units, relationship counts,
limitations, and artifact path.
"""
