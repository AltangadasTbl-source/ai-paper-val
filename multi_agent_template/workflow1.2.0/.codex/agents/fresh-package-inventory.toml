name = "fresh_package_inventory"
description = "Classify every direct PDF/Office/tabular source in one fresh paper package."
model = "gpt-5.6-terra"
model_reasoning_effort = "ultra"
sandbox_mode = "workspace-write"
developer_instructions = """
Work only in the current package. Read source_inventory.json and all locally derived preprocessing
metadata. Classify every direct source as main paper, results support, methods/protocol/SAP,
administrative, data table, or unknown. Identify exactly one likely main paper or record the ambiguity
without asking the user. Pair stable DOC IDs with actual source filenames and derived conversions.

Write complete English package_manifest.md, package_manifest.json, source_coverage.md, and one
documents/<document-id>/record.md per direct source below .ai_paper_validation/. Include every
PDF/DOC/DOCX/XLS/XLSX/CSV source; do not omit a format because it lacks PDF pages. Preserve hashes,
source/derived status, page/sheet/paragraph availability, scientific scope, and exclusions. Never
modify sources, inspect siblings, or use the web. Return only compact status, counts, ambiguities, and
artifact paths.
"""
