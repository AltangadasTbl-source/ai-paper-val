[runtime]
platform = "linux"
autonomous = true
ask_before_execution = false

[parallel]
enabled = true
max_specialists = 6

[ocr]
mode = "cpu"
allow_gpu = false
native_text_first = true
new_ocr_scope = "targeted-pages-only"
preferred_backend = "tesseract-cpu"
missing_backend = "record-and-continue"

[review]
max_queue_candidates = 10
candidate_ledger_unbounded = true
ai_adjudication = false

[tools]
pandoc = "pandoc"
pdfinfo = "pdfinfo"
pdftotext = "pdftotext"
pdftoppm = "pdftoppm"
tesseract = "tesseract"
libreoffice = "libreoffice"
