agent: main_text_extractor
document:
  id: JAMA2019-10517-D01
  filename: jama_flint_2019_oi_190079.pdf
  title: "Effect of Continuing Olanzapine vs Placebo on Relapse Among Patients With Psychotic Depression in Remission: The STOP-PD II Randomized Clinical Trial"
  article_pdf_pages_reviewed: "1-10"
  result_pages_with_key_evidence: [1, 3, 4, 6, 7, 8, 9]
scope_note: "Extracted reported main-article results and internal comparators only. No inconsistency assessment, diagnosis, or correction proposed."

outcome_definitions:
  - location: "PDF p1 (printed p622), abstract, Main Outcomes and Measures; PDF p4 (printed p625), Outcomes"
    verbatim: "The primary outcome was risk of relapse. Main secondary outcomes were change in weight, waist circumference, lipids, serum glucose, and hemoglobin A1c (HbA1c)."
    primary_relapse_definition_location: "PDF p4 (printed p625), Outcomes—Primary Outcome: Relapse"
    primary_relapse_definition: "Declaring relapse required at least 1 of: DSM-IV major depressive episode; 17-item HDRS score >=18; SCID-rated psychosis; or significant clinical worsening (suicide plan/attempt, SCID-rated mania/hypomania, or psychiatric hospitalization)."
  - location: "PDF p4 (printed p625), Outcomes—Secondary Outcomes: Anthropometric and Metabolic Measures"
    secondary_measure_schedule: "Weight and waist circumference were measured at each visit; fasting cholesterol, triglycerides, glucose, and HbA1c at RCT baseline, every 8 weeks, and termination."

