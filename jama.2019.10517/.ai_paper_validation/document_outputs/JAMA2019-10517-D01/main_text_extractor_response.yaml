primary_outcome:
  name: "Risk of relapse over the 36-week randomized trial"
  result:
    location: "PDF p6 (printed p627), Results—Primary Outcome; corroborated PDF p1 (printed p622), abstract, Results"
    groups:
      sertraline_plus_olanzapine: "13/64 (20.3%)"
      sertraline_plus_placebo: "34/62 (54.8%)"
    effect_estimate: "Adjusted Cox HR 0.25 (95% CI 0.13-0.48); P < .001"
    verbatim: "A relapse occurred in 13 of 64 participants (20.3%)... and 34 of 62 (54.8%)... In the multivariable Cox proportional hazards model, there was a statistically significant difference in risk of relapse between randomized groups (hazard ratio [HR], 0.25 [95% CI, 0.13-0.48], P < .001)."
  event_components:
    location: "PDF p7 (printed p628), Table 3, Number of Relapse Events"
    table_note: "More than 1 event occurred in some cases of relapse."
    sertraline_plus_olanzapine:
      depression_no_psychosis: 5
      psychosis_no_depression: 0
      depression_and_psychosis: 4
      suicide_plan_or_attempt: 0
      mania_or_hypomania: 0
      psychiatric_hospitalization: 6
    sertraline_plus_placebo:
      depression_no_psychosis: 18
      psychosis_no_depression: 1
      depression_and_psychosis: 11
      suicide_plan_or_attempt: 3
      mania_or_hypomania: 0
      psychiatric_hospitalization: 11
  figure_result:
    location: "PDF p7 (printed p628), Figure 2, Probability of Not Experiencing a Relapse"
    at_risk_counts_by_week:
      weeks: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36]
      sertraline_plus_olanzapine: [64, 60, 57, 56, 52, 52, 49, 47, 44, 43]
      sertraline_plus_placebo: [62, 54, 39, 36, 32, 31, 28, 26, 25, 24]
    caption_values: "Median observation: 36 weeks (IQR, 24.8-36) olanzapine vs 19.5 weeks (IQR, 5.3-36) placebo; log-rank P < .001; shaded area represents 95% CIs."
  sensitivity_analysis:
    location: "PDF p7 (printed p628), Results—Primary Outcome"
    population: "Excluded 7 participants who elected to discontinue either/both study medications but remained for research assessments."
    effect_estimate: "HR 0.22 (95% CI 0.11-0.43); P < .001"
  related_reported_quantities:
    location: "PDF p7 (printed p628), Results—Primary Outcome; PDF p8 (printed p629), Discussion"
    values:
      number_needed_to_treat: 2.8
      relapse_hospitalization: "6/13 (46.2%) olanzapine-arm relapses and 11/34 (32.3%) placebo-arm relapses required psychiatric hospitalization because of relapse."
      timing_claim: "With placebo, the majority of relapses occurred within the first 12 weeks after randomization; olanzapine-arm relapses were distributed throughout the 36-week trial."

