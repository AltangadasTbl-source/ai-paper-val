candidates:
  - id: FFC-01
    duplicate_note: "Same underlying unit conflict independently identified as TAC-03 in table_arithmetic_checker_response.yaml; coordinator should deduplicate."
    category: Presentation inconsistency
    severity: low
    issue_statement: "The main article labels the HbA1c treatment-by-time estimate in mg/dL, while both the main-article HbA1c table row and the explicitly referenced supplementary HbA1c figure label the outcome in percent."
    exact_locations:
      reported_item:
        - document_id: JAMA2019-10517-D01
          filename: jama_flint_2019_oi_190079.pdf
          pdf_page: 1
          printed_page: 622
          location: "Abstract—Results, final secondary-outcome sentence"
        - document_id: JAMA2019-10517-D01
          filename: jama_flint_2019_oi_190079.pdf
          pdf_page: 7
          printed_page: 628
          location: "Results—Secondary Outcomes, paragraph above the eFigures 1-8 cross-reference"
      comparators:
        - document_id: JAMA2019-10517-D01
          filename: jama_flint_2019_oi_190079.pdf
          pdf_page: 8
          printed_page: 629
          location: "Table 4, row label 'HbA1c, %'"
        - document_id: JAMA2019-10517-D03
          filename: joi190079supp2_prod.pdf
          pdf_page: 9
          location: "eFigure 8, y-axis label 'HbA1c (%)'"
    labelled_evidence:
      reported:
        - "D01 p1 abstract: 'HbA1c levels (−0.0002 mg/dL; 95% CI, −0.0021 to 0.0016).'"
        - "D01 p7 Results: 'HbA1c levels (−0.0002 mg/dL [95% CI, −0.0021 to 0.0016], adjusted P = .99).'"
      comparators:
        - "D01 p8 Table 4 labels the row 'HbA1c, %' and displays values on the approximately 5.7-5.9 scale."
        - "D03 p9 eFigure 8 visibly labels its y-axis 'HbA1c (%)' with ticks 5.6, 5.8, 6.0, and 6.2."
    direct_comparison: "Reported interaction estimate unit: mg/dL. Same named outcome in both result-bearing displays: %. No conversion or alternative HbA1c unit is stated in the supplied article package."
    reproducible_logical_chain:
      inputs:
        - "Main-text unit attached to −0.0002 and its CI: mg/dL."
        - "Table 4 HbA1c row unit: %."
        - "eFigure 8 HbA1c y-axis unit: %."
      rule: "A reported model coefficient for an outcome must use or explicitly convert from the outcome's displayed measurement unit."
      result: "The supplied displays conflict with the unit printed beside the model coefficient; the package supports % but does not document an mg/dL conversion."
      rounding_tolerance: "Not applicable; this is a unit-label comparison and does not change the estimate, CI, or P value."
    bounded_impact: "The conflict is limited to the unit used to interpret the HbA1c coefficient and CI; it does not by itself establish that the numerical estimate, confidence interval, P value, or no-difference conclusion is incorrect."
    verification_steps:
      - "1. On D01 PDF p1 and p7, confirm that −0.0002 and its CI are followed by 'mg/dL'."
      - "2. On D01 PDF p8, confirm the Table 4 row label is 'HbA1c, %'."
      - "3. On D03 PDF p9, confirm eFigure 8's y-axis reads 'HbA1c (%)'."
      - "4. Check the original model-output variable definition or a publisher correction: documentation that the coefficient was converted to mg/dL would resolve the candidate; confirmation that HbA1c was modeled in percentage points would confirm a unit-label error."
no_issue_results:
  - location: "D01 PDF p3 (printed p624), Figure 1"
    result: "All visible participant-flow balances reproduce: 350−81=269; excluded reasons 60+16+5=81; 269−74=195; open-label discontinuation reasons 31+21+7+5+1+9=74; 195−33=162; 162−15=147; stabilization discontinuation reasons 4+2+1+1+7=15; 147−21=126; 12+9=21; 64+62=126. Arm boxes also balance: 59+5=64, 60+2=62, 43+13+8=64, and 24+34+4=62. These counts agree with the randomized denominators and relapse counts in the Results."
  - location: "D01 PDF p7 (printed p628), Figure 2"
    result: "The week-0 risk sets equal the randomized arms (64 and 62), group labels match Figure 1 and the Results, risk-set counts are nonincreasing through week 36, and the displayed curves/caption do not conflict with the reported 13/64 versus 34/62 relapses or log-rank P<.001. Exact curve heights were not inferred from pixels."
  - location: "D03 PDF pp2-8 and p10, eFigures 1-7 and 9"
    result: "Titles, outcome axes/units, time axes, and group legends are internally consistent with the named main-text outcomes and reported qualitative directions. eFigure 6 visibly distinguishes treatment and dropout status in four legend entries. No exact point values, sample sizes, or risk sets are printed, so no exact numerical contradiction is asserted."
  - location: "D03 PDF pp2-10, translucent colored bands"
    result: "Not a candidate: the figures do not define the bands, so their statistical meaning is ambiguous; no contradiction was inferred from them."
overall_result: "One low-severity, document-verifiable unit-label candidate (duplicate of TAC-03); no participant-flow, risk-set, group-label, axis, caption, or other figure inconsistency identified."
